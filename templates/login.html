<!DOCTYPE html>
<html>
  <head>
      <meta charset="UTF-8">
      <title>ログイン - ToDo アプリ</title>
      <link rel="stylesheet" href="{{ url_for('static', filename='css/common.css') }}">
  </head>
  <body>
    <h1>ToDo アプリ - ログイン</h1>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <ul style="color:red;">
          {% for msg in messages %}
            <li>{{ msg }}</li>
          {% endfor %}
        </ul>
      {% endif %}
    {% endwith %}

  <form method="POST">
    <label>ユーザー名:</label>
    <input type="text" name="username" required style="width: 220px; padding: 8px 12px; border: 1px solid #ccc; border-radius: 4px; font-size: 1em;">
    <br><br>
    <label>パスワード:</label>
    <input type="password" name="password" required style="width: 220px; padding: 8px 12px; border: 1px solid #ccc; border-radius: 4px; font-size: 1em;">
    <br><br>
    <button type="submit">ログイン</button>
  </form>
  </body>
</html>
